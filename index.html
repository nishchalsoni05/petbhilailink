<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet's Super Bazar Bhilai</title>
  <meta name="description" content="Comprehensive pet store providing professional grooming services and a range of pet supplies.">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <main class="profile-card">
      
      <!-- Pet's Super Bazar Profile Section -->
      <section class="profile-section">
        <div class="profile-avatar-wrapper">
          <img src="petlogo.jpeg" alt="Pet's Super Bazar Bhilai" class="profile-avatar-img">
        </div>

        <h1 class="profile-title">Pet's Super Bazar Bhilai</h1>

        <p class="profile-description">
          Comprehensive pet store providing professional grooming services and a range of pet supplies.
        </p>
      </section>

      <!-- Pill-Shaped Link Buttons -->
      <section class="links-section">
        
        <!-- Link 1: Google Reviews -->
        <a href="https://g.page/r/CXLG8g6OJP9gEBM/review" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button" 
           id="btn-google-reviews"
           title="PET'S Super Bazar Grooming Salon - Google Review">
          <div class="link-icon-container">
            <img src="google.svg" alt="Google Review" class="link-icon">
          </div>
          <span class="link-text">Google Review | TAP HERE</span>
          <div class="link-options-icon" aria-hidden="true">
            <svg width="4" height="16" viewBox="0 0 4 16" fill="currentColor">
              <circle cx="2" cy="2" r="1.5"/>
              <circle cx="2" cy="8" r="1.5"/>
              <circle cx="2" cy="14" r="1.5"/>
            </svg>
          </div>
        </a>

        <!-- Link 2: WhatsApp -->
        <a href="https://wa.me/917089283900" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button" 
           id="btn-whatsapp">
          <div class="link-icon-container">
            <img src="whatsapp.svg" alt="WhatsApp" class="link-icon">
          </div>
          <span class="link-text">WhatsApp | Start chatting here</span>
          <div class="link-options-icon" aria-hidden="true">
            <svg width="4" height="16" viewBox="0 0 4 16" fill="currentColor">
              <circle cx="2" cy="2" r="1.5"/>
              <circle cx="2" cy="8" r="1.5"/>
              <circle cx="2" cy="14" r="1.5"/>
            </svg>
          </div>
        </a>

        <!-- Link 3: Instagram -->
        <a href="https://www.instagram.com/petsuperbazaar?utm_source=qr&amp;vrfl=MTVhenpxeG5yN3Vnbg==" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="link-button link-button-multiline" 
           id="btn-instagram">
          <div class="link-icon-container">
            <img src="instagram.svg" alt="Instagram" class="link-icon">
          </div>
          <div class="link-text-group">
            <span class="link-text-main">Pet super Bazaar | Grooming salon</span>
            <span class="link-text-sub">(@petsuperbazaar) • Instagram photos and videos</span>
          </div>
          <div class="link-options-icon" aria-hidden="true">
            <svg width="4" height="16" viewBox="0 0 4 16" fill="currentColor">
              <circle cx="2" cy="2" r="1.5"/>
              <circle cx="2" cy="8" r="1.5"/>
              <circle cx="2" cy="14" r="1.5"/>
            </svg>
          </div>
        </a>

      </section>

      <!-- SoberStuds Whole Logo in Center Bottom (Clickable to WhatsApp) -->
      <footer class="card-footer">
        <div class="footer-brand-container">
          <a href="https://wa.me/919243334046?text=hi%20i%20am%20intrested%20in%20your%20tap%20to%20review%20product" 
             target="_blank" 
             rel="noopener noreferrer" 
             class="footer-brand-link" 
             title="Contact SoberStuds on WhatsApp" 
             aria-label="Contact SoberStuds on WhatsApp">
            <img src="logo.png" alt="SoberStuds" class="footer-full-logo">
          </a>
        </div>
      </footer>

    </main>
  </div>
</body>
</html>
